const SIZES = [

const FITS = [

/* ---------- Hoodie geometry (viewBox units) ---------- */
const G = {
  hoodFront: 'M126 100 C100 8 300 8 274 100 C256 130 144 130 126 100 Z',
  hoodBack: 'M124 98 C98 4 302 4 276 98 C268 150 132 150 124 98 Z',
  bodyFront: 'M122 96 L100 108 L104 398 L296 398 L300 108 L278 96 C256 128 144 128 122 96 Z',
  bodyBack: 'M122 96 L100 108 L104 398 L296 398 L300 108 L278 96 C252 110 148 110 122 96 Z',
  sleeveL: 'M100 108 L58 122 C34 200 24 270 20 326 L76 342 C90 290 100 240 104 196 Z',

const OUTLINES = {
  front: {
    body: [G.bodyFront], sleeves: [G.sleeveL, G.sleeveR], hood: [G.hoodFront],
    strings: [G.stringL, G.stringR], cuffs: [G.cuffL, G.cuffR, G.hem]
  },
  back: {

const SEAM = { stroke: 'rgba(0,0,0,.3)', strokeWidth: 1.5, strokeLinejoin: 'round' };

/* ---------- Helpers ---------- */
const money = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const colourName = (hex) => {
  const f = COLOURS.find((c) => c.hex.toLowerCase() === hex.toLowerCase());
  return f ? f.name : 'Custom ' + hex.toUpperCase();
};

function wrapLines(str) {
  const s = str.trim().replace(/\s+/g, ' ');
  if (!s) return [];
  if (s.length <= 11 || s.indexOf(' ') === -1) return [s];
  const words = s.split(' ');
  let best = null;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' ');
    const b = words.slice(i).join(' ');
    const m = Math.max(a.length, b.length);
    if (!best || m < best.m) best = { m: m, lines: [a, b] };
  }
  return best.lines;
}

function useAnimatedNumber(target) {
  const [val, setVal] = useState(target);
  const from = useRef(target);
  const raf = useRef(0);
  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { from.current = target; setVal(target); return undefined; }
    const start = performance.now();
    const a = from.current;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / 350);
      const e = 1 - Math.pow(1 - t, 3);
      const v = a + (target - a) * e;
      from.current = v;
      setVal(v);
      if (t < 1) raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [target]);
  return Math.round(val);
}

/* ---------- Small UI pieces ---------- */
function Segmented({ options, value, onChange, label }) {
  return (
    <div role="group" aria-label={label} className="inline-flex gap-1 rounded-none bg-panel2 p-1">
      {options.map((o) => (

            (value === o.id ? 'bg-fg text-bg' : 'text-muted hover:text-fg')}
        >{o.label}</button>
      ))}
    </div>
  );
}

function Swatches({ value, onChange, label }) {
  const isPreset = COLOURS.some((c) => c.hex.toLowerCase() === value.toLowerCase());
  return (
    <div role="group" aria-label={label} className="flex flex-wrap gap-2">
      {COLOURS.map((c) => {
        const on = c.hex.toLowerCase() === value.toLowerCase();
        return (
          <button
            key={c.hex} type="button" title={c.name} aria-label={c.name} aria-pressed={on}
            onClick={() => onChange(c.hex)}
            className={'h-11 w-11 rounded-full border border-line transition duration-150 hover:scale-110 active:scale-95 ' +
              (on ? 'ring-2 ring-accent ring-offset-2 ring-offset-panel' : '')}
            style={{ background: c.hex }}
          />
        );
      })}
      <label
        title="Custom colour"
        className={'relative grid h-11 w-11 cursor-pointer place-items-center rounded-full border border-dashed border-muted text-muted transition duration-150 hover:scale-110 focus-within:ring-2 focus-within:ring-accent ' +
          (!isPreset ? 'ring-2 ring-accent ring-offset-2 ring-offset-panel' : '')}
        style={!isPreset ? { background: value } : undefined}
      >
        {isPreset && (
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path d="M9 3v12M3 9h12" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none" />
          </svg>
        )}
        <input
          type="color" aria-label="Custom colour" value={value}
          onChange={(e) => onChange(e.target.value)}
          className="absolute inset-0 h-full w-full cursor-pointer opacity-0"
        />
      </label>
    </div>
  );
}

/* ---------- Printed layer: text and graphic on one side ---------- */
function PrintLayer({ side, text, graphic }) {
  const hasText = text.value.trim().length > 0 && text.side === side;
  const hasG = !!graphic && graphic.side === side;
  if (!hasText && !hasG) return null;
  const a = side === 'front'
    ? { top: 198, bottom: 296, maxW: 140, base: 40 }
    : { top: 168, bottom: 362, maxW: 180, base: 64 };
  const h = a.bottom - a.top;
  const gSize = hasG ? (hasText ? h * 0.55 : Math.min(h, a.maxW) * 0.9) : 0;
  const gCy = hasText ? a.top + gSize / 2 : (a.top + a.bottom) / 2;
  const tTop = hasG ? a.top + gSize + 8 : a.top;
  const tH = a.bottom - tTop;
  const font = FONTS.find((f) => f.id === text.font) || FONTS[0];
  const lines = hasText ? wrapLines(text.value) : [];
  const longest = lines.reduce((m, l) => Math.max(m, l.length), 1);
  const fsMax = Math.min(a.base, (tH / Math.max(lines.length, 1)) * 0.92, a.maxW / (longest * font.cw));
  const fs = fsMax * text.scale;
  const lh = fs * 1.05;
  const mid = tTop + tH / 2;
  return (
    <g pointerEvents="none">
      {hasG && graphic.kind === 'sample' && (
        <g transform={'translate(' + (200 - gSize / 2) + ' ' + (gCy - gSize / 2) + ') scale(' + gSize / 100 + ')'}>
          <circle cx="50" cy="50" r="44" fill="none" stroke={graphic.color} strokeWidth="6" />
          <path d="M50 14 L58 42 L86 50 L58 58 L50 86 L42 58 L14 50 L42 42 Z" fill={graphic.color} />
        </g>
      )}
      {hasG && graphic.kind === 'upload' && (
        <image
          href={graphic.src} x={200 - gSize / 2} y={gCy - gSize / 2} width={gSize} height={gSize}
          preserveAspectRatio="xMidYMid meet"
        />
      )}
      {lines.map((l, i) => (
        <text
          key={i} x="200" y={mid + (i - (lines.length - 1) / 2) * lh + fs * 0.34}
          textAnchor="middle" fill={text.color} fontSize={fs}
          style={{ fontFamily: font.css, letterSpacing: '0.01em' }}
        >{l}</text>
      ))}
    </g>
  );
}

/* ---------- The hoodie ---------- */

/* ---------- The builder ---------- */
function HoodieBuilder({ onAddToCart }) {
  const [view, setView] = useState('front');
  const [tab, setTab] = useState('colors');
  const [colors, setColors] = useState({ body: '#14181F', sleeves: '#14181F', hood: '#14181F', strings: '#E8A93A', cuffs: '#14181F' });
  const [part, setPart] = useState('body');
  const [fabric, setFabric] = useState('classic');
  const [text, setText] = useState({ value: 'Midnight Chai', font: 'bebas', color: '#E8A93A', side: 'front', scale: 1 });
  const [graphic, setGraphic] = useState(null);
  const [uploadError, setUploadError] = useState('');
  const [size, setSize] = useState('M');
  const [fit, setFit] = useState('regular');
  const [toast, setToast] = useState('');
  const [drag, setDrag] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => {
    if (!toast) return undefined;
    const t = setTimeout(() => setToast(''), 3200);
    return () => clearTimeout(t);
  }, [toast]);

  const sz = SIZES.find((s) => s.id === size);
  const ft = FITS.find((f) => f.id === fit);
  const chest = sz.chest + ft.chestAdd;
  const length = sz.len + ft.lenAdd;

  const { lines, total } = useMemo(() => {
    const out = [{ label: 'Hoodie, ' + FABRICS[0].name.toLowerCase(), amt: PRICING.base }];
    const fb = FABRICS.find((f) => f.id === fabric);
    if (fb.delta) out.push({ label: 'Upgrade to ' + fb.name.toLowerCase() + ' (' + fb.gsm + ' GSM)', amt: fb.delta });
    if (fit === 'oversized') out.push({ label: 'Oversized cut', amt: PRICING.oversized });
    if (size === 'XL') out.push({ label: 'Size XL', amt: PRICING.sizeXL });
    if (text.value.trim()) out.push({ label: 'Text print, ' + text.side, amt: PRICING.textPrint });
    if (graphic) out.push({ label: 'Graphic print, ' + graphic.side, amt: PRICING.graphicPrint });
    const distinct = new Set(Object.values(colors).map((c) => c.toLowerCase())).size;
    if (distinct > 1) out.push({ label: 'Colour-blocking (' + distinct + ' colours)', amt: PRICING.colourBlock });
    return { lines: out, total: out.reduce((s, l) => s + l.amt, 0) };
  }, [fabric, fit, size, text.value, text.side, graphic, colors]);

  const shownTotal = useAnimatedNumber(total);

  const setPartColour = (hex) => setColors((c) => ({ ...c, [part]: hex }));
  const pickPart = (id) => { setPart(id); setTab('colors'); };
  const placeText = (side) => { setText((t) => ({ ...t, side: side })); setView(side); };
  const placeGraphic = (side) => { setGraphic((g) => (g ? { ...g, side: side } : g)); setView(side); };

  const readFile = (file) => {
    if (!file) return;
    if (!/^image\/(png|jpe?g|webp|gif|svg\+xml)$/.test(file.type)) {
      setUploadError('Use a PNG, JPG, WebP or SVG image.');
      return;
    }
    if (file.size > 4 * 1024 * 1024) {
      setUploadError('That file is over 4 MB. Try a smaller image.');
      return;
    }
    const r = new FileReader();
    r.onload = () => {
      setUploadError('');
      setGraphic((g) => ({ kind: 'upload', src: r.result, name: file.name, side: g ? g.side : 'front', color: '#E8A93A' }));
    };
    r.onerror = () => setUploadError('Could not read that file. Try another.');
    r.readAsDataURL(file);
  };

  const reset = () => {
    setColors({ body: '#14181F', sleeves: '#14181F', hood: '#14181F', strings: '#E8A93A', cuffs: '#14181F' });
    setText({ value: 'Midnight Chai', font: 'bebas', color: '#E8A93A', side: 'front', scale: 1 });
    setGraphic(null); setUploadError(''); setFabric('classic'); setSize('M'); setFit('regular');
    setPart('body'); setView('front'); setToast('Design reset to the example.');
  };

  const addToCart = () => {
    if (!onAddToCart) return;
    onAddToCart({
      unit: total, size: size, fit: fit, fabric: fabric, colors: { ...colors },
      text: text.value.trim() ? { value: text.value.trim(), font: text.font, color: text.color, side: text.side } : null,
      graphic: graphic ? { name: graphic.name, kind: graphic.kind, side: graphic.side } : null
    });
  };

  const TABS = [
    { id: 'colors', label: 'Fabric & colours' },
    { id: 'graphics', label: 'Graphics & text' },
    { id: 'fit', label: 'Size & fit' }
  ];
  const tabIdx = TABS.findIndex((t) => t.id === tab);
  const card = 'rounded-none border border-line bg-bg p-4 sm:p-5';
  const h3 = 'font-display text-lg font-extrabold tracking-tight';
  const partLabel = PARTS.find((p) => p.id === part).label;

  return (
    <div className="font-body">
      <div className="grid items-start gap-5 lg:grid-cols-[minmax(0,1.08fr)_minmax(0,1fr)] lg:gap-8">

        {/* STAGE */}
        <section
          aria-label="Hoodie preview"
          className="dots sticky z-20 rounded-none border border-line bg-stage p-3 sm:p-5 lg:top-6"
          style={{ top: 'calc(env(safe-area-inset-top, 0px) + 68px)' }}
        >
          <div className="flex flex-wrap items-center justify-between gap-2">
            <Segmented
              label="Hoodie view" value={view} onChange={setView}
              options={[{ id: 'front', label: 'Front' }, { id: 'back', label: 'Back' }]}
            />
            <p className="rounded-none bg-panel px-3 py-2 text-sm font-bold text-fg">Editing: {partLabel}</p>
          </div>
          <HoodieSvg
            colors={colors} view={view} fit={fit} chest={chest} part={part}
            onPick={pickPart} text={text} graphic={graphic}
          />
          <p className="mt-1 hidden text-center text-sm text-muted sm:block">Click a part of the hoodie to recolour it.</p>
        </section>

        {/* PANEL */}
        <section aria-label="Customise" className="min-w-0 overflow-hidden rounded-none border border-line bg-panel">
          <div className="relative border-b border-line">
            <div role="tablist" aria-label="Customisation" className="grid grid-cols-3">
              {TABS.map((t) => (
                <button
                  key={t.id} type="button" role="tab" id={'tab-' + t.id} aria-selected={tab === t.id}
                  aria-controls={'panel-' + t.id} onClick={() => setTab(t.id)}
                  className={'min-h-[52px] px-2 text-sm font-bold transition-colors duration-200 sm:text-base ' +
                    (tab === t.id ? 'text-fg' : 'text-muted hover:text-fg')}
                >{t.label}</button>
              ))}
            </div>
            <span
              aria-hidden="true"
              className="absolute bottom-0 left-0 h-[3px] w-1/3 bg-accent transition-transform duration-300 ease-out"
              style={{ transform: 'translateX(' + tabIdx * 100 + '%)' }}
            />
          </div>

          <div className="p-4 sm:p-6">

            {/* TAB: colours */}
            {tab === 'colors' && (
              <div role="tabpanel" id="panel-colors" aria-labelledby="tab-colors" className="rise flex flex-col gap-5">
                <div className={card}>
                  <h3 className={h3}>Fabric</h3>
                  <div className="mt-3 grid gap-3 sm:grid-cols-2">
                    {FABRICS.map((f) => (
                      <button
                        key={f.id} type="button" aria-pressed={fabric === f.id} onClick={() => setFabric(f.id)}
                        className={'min-w-0 rounded-none border-2 p-4 text-left transition duration-200 hover:-translate-y-0.5 ' +
                          (fabric === f.id ? 'border-accent bg-panel' : 'border-line bg-panel')}
                      >
                        <span className="flex items-baseline justify-between gap-2">
                          <span className="font-bold">{f.name}</span>
                          <span className="tnum text-sm font-bold text-muted">{f.delta ? '+' + money(f.delta) : 'Included'}</span>
                        </span>
                        <span className="mt-1 block text-sm text-muted">{f.gsm} GSM. {f.blurb}</span>
                      </button>
                    ))}
                  </div>
                  <p className="mt-3 text-sm text-muted">[CONFIRM FABRIC BLEND AND WEIGHT WITH YOUR SUPPLIER]</p>
                </div>

                <div className={card}>
                  <h3 className={h3}>Colours</h3>
                  <div className="mt-3 flex flex-wrap gap-2" role="group" aria-label="Hoodie part">
                    {PARTS.map((p) => (
                      <button
                        key={p.id} type="button" aria-pressed={part === p.id} onClick={() => setPart(p.id)}
                        className={'inline-flex min-h-[44px] items-center gap-2 rounded-none border-2 px-4 text-sm font-bold transition duration-200 hover:-translate-y-0.5 ' +
                          (part === p.id ? 'border-accent bg-panel text-fg' : 'border-line bg-panel text-muted hover:text-fg')}
                      >
                        <span className="h-4 w-4 rounded-full border border-line" style={{ background: colors[p.id] }} />
                        {p.label}
                      </button>
                    ))}
                  </div>
                  <p className="mt-4 mb-3 text-sm text-muted">
                    {partLabel}: <span className="font-bold text-fg">{colourName(colors[part])}</span>
                    {part === 'strings' && view === 'back' ? ' (drawstrings show on the front view)' : ''}
                  </p>
                  <Swatches value={colors[part]} onChange={setPartColour} label={partLabel + ' colour'} />
                  <button
                    type="button"
                    onClick={() => setColors({ body: colors[part], sleeves: colors[part], hood: colors[part], strings: colors[part], cuffs: colors[part] })}
                    className="mt-4 min-h-[44px] rounded-none border-2 border-line px-4 text-sm font-bold transition duration-200 hover:border-accent"
                  >Use {colourName(colors[part])} on every part</button>
                </div>
              </div>
            )}

            {/* TAB: graphics */}
            {tab === 'graphics' && (
              <div role="tabpanel" id="panel-graphics" aria-labelledby="tab-graphics" className="rise flex flex-col gap-5">
                <div className={card}>
                  <h3 className={h3}>Text</h3>
                  <label htmlFor="text-input" className="mt-3 block text-sm font-bold">Your words</label>
                  <input
                    id="text-input" type="text" maxLength={24} value={text.value} placeholder="Type your text"
                    onChange={(e) => setText((t) => ({ ...t, value: e.target.value }))}
                    className="mt-1 h-12 w-full rounded-none border-2 border-line bg-panel px-4 text-base text-fg transition-colors duration-200 placeholder:text-muted focus:border-accent"
                  />
                  <p className="mt-1 text-sm text-muted tnum">{text.value.length} of 24 characters. Long text wraps to two lines.</p>

                  <p className="mt-4 mb-2 text-sm font-bold">Font</p>
                  <div className="grid gap-2 sm:grid-cols-2" role="group" aria-label="Font">
                    {FONTS.map((f) => (
                      <button
                        key={f.id} type="button" aria-pressed={text.font === f.id}
                        onClick={() => setText((t) => ({ ...t, font: f.id }))}
                        className={'min-w-0 rounded-none border-2 bg-panel px-4 py-3 text-left transition duration-200 hover:-translate-y-0.5 ' +
                          (text.font === f.id ? 'border-accent' : 'border-line')}
                      >
                        <span className="block truncate text-xl leading-tight" style={{ fontFamily: f.css }}>{text.value.trim() || 'Your text'}</span>
                        <span className="mt-1 block text-xs font-bold text-muted">{f.name}, {f.note.toLowerCase()}</span>
                      </button>
                    ))}
                  </div>

                  <p className="mt-4 mb-2 text-sm font-bold">Text colour: <span className="font-normal text-muted">{colourName(text.color)}</span></p>
                  <Swatches value={text.color} onChange={(hex) => setText((t) => ({ ...t, color: hex }))} label="Text colour" />

                  <div className="mt-4 flex flex-wrap items-center gap-x-6 gap-y-3">
                    <div>
                      <p className="mb-2 text-sm font-bold">Place on</p>
                      <Segmented label="Text placement" value={text.side} onChange={placeText} options={[{ id: 'front', label: 'Front' }, { id: 'back', label: 'Back' }]} />
                    </div>
                    <div className="min-w-[180px] flex-1">
                      <label htmlFor="text-size" className="mb-2 block text-sm font-bold">Size <span className="font-normal text-muted tnum">{Math.round(text.scale * 100)}%</span></label>
                      <input
                        id="text-size" type="range" min="50" max="100" step="5" value={Math.round(text.scale * 100)}
                        onChange={(e) => setText((t) => ({ ...t, scale: Number(e.target.value) / 100 }))}
                        className="h-11 w-full cursor-pointer"
                      />
                    </div>
                  </div>
                </div>

                <div className={card}>
                  <h3 className={h3}>Graphic</h3>
                  <input
                    ref={fileRef} id="graphic-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"
                    className="sr-only"
                    onChange={(e) => { readFile(e.target.files && e.target.files[0]); e.target.value = ''; }}
                  />
                  <div
                    onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
                    onDragLeave={() => setDrag(false)}
                    onDrop={(e) => { e.preventDefault(); setDrag(false); readFile(e.dataTransfer.files && e.dataTransfer.files[0]); }}
                    className={'mt-3 flex flex-col items-center gap-3 rounded-none border-2 border-dashed px-4 py-6 text-center transition-colors duration-200 ' +
                      (drag ? 'border-accent bg-panel2' : 'border-line bg-panel')}
                  >
                    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" className="text-muted">
                      <path d="M14 20V6M8 12l6-6 6 6M5 22h18" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none" />
                    </svg>
                    <p className="text-sm text-muted">Drop an image here, or choose one. PNG, JPG, WebP or SVG, up to 4 MB.</p>
                    <div className="flex flex-wrap justify-center gap-2">
                      <button
                        type="button" onClick={() => fileRef.current && fileRef.current.click()}
                        className="min-h-[44px] rounded-none bg-accent px-5 text-sm font-bold text-onaccent transition duration-200 hover:-translate-y-0.5 active:translate-y-0"
                      >Upload graphic</button>
                      <button
                        type="button"
                        onClick={() => { setUploadError(''); setGraphic((g) => ({ kind: 'sample', src: '', name: 'Sample graphic', side: g ? g.side : 'front', color: g && g.color ? g.color : '#E8A93A' })); }}
                        className="min-h-[44px] rounded-none border-2 border-line px-5 text-sm font-bold transition duration-200 hover:border-accent"
                      >Use sample graphic</button>
                    </div>
                  </div>
                  {uploadError && <p role="alert" className="mt-2 text-sm font-bold text-accent">{uploadError}</p>}

                  {graphic && (
                    <div className="rise mt-4 flex flex-col gap-4">
                      <p className="text-sm"><span className="font-bold">{graphic.name}</span> <span className="text-muted">is on the {graphic.side}.</span></p>
                      <div className="flex flex-wrap items-center gap-4">
                        <div>
                          <p className="mb-2 text-sm font-bold">Place on</p>
                          <Segmented label="Graphic placement" value={graphic.side} onChange={placeGraphic} options={[{ id: 'front', label: 'Front' }, { id: 'back', label: 'Back' }]} />
                        </div>
                        <button
                          type="button" onClick={() => setGraphic(null)}
                          className="mt-auto min-h-[44px] rounded-none border-2 border-line px-4 text-sm font-bold transition duration-200 hover:border-accent"
                        >Remove graphic</button>
                      </div>
                      {graphic.kind === 'sample' && (
                        <div>
                          <p className="mb-2 text-sm font-bold">Graphic colour: <span className="font-normal text-muted">{colourName(graphic.color)}</span></p>
                          <Swatches value={graphic.color} onChange={(hex) => setGraphic((g) => ({ ...g, color: hex }))} label="Graphic colour" />
                        </div>
                      )}
                    </div>
                  )}
                  <p className="mt-3 text-sm text-muted">Uploads stay in your browser for this preview. Print files are checked after you order.</p>
                </div>
              </div>
            )}

            {/* TAB: size & fit */}
            {tab === 'fit' && (
              <div role="tabpanel" id="panel-fit" aria-labelledby="tab-fit" className="rise flex flex-col gap-5">
                <div className={card}>
                  <h3 className={h3}>Size</h3>
                  <div className="mt-3 grid grid-cols-4 gap-2" role="group" aria-label="Size">
                    {SIZES.map((s) => (
                      <button
                        key={s.id} type="button" aria-pressed={size === s.id} onClick={() => setSize(s.id)}
                        className={'rounded-none border-2 bg-panel py-3 transition duration-200 hover:-translate-y-0.5 active:translate-y-0 ' +
                          (size === s.id ? 'border-accent' : 'border-line')}
                      >
                        <span className="block font-display text-2xl font-extrabold">{s.id}</span>
                        <span className="block text-xs text-muted tnum">{s.chest} in chest</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className={card}>
                  <h3 className={h3}>Fit</h3>
                  <div className="mt-3 grid gap-3 sm:grid-cols-2" role="group" aria-label="Fit">
                    {FITS.map((f) => (
                      <button
                        key={f.id} type="button" aria-pressed={fit === f.id} onClick={() => setFit(f.id)}
                        className={'min-w-0 rounded-none border-2 bg-panel p-4 text-left transition duration-200 hover:-translate-y-0.5 ' +
                          (fit === f.id ? 'border-accent' : 'border-line')}
                      >
                        <span className="flex items-baseline justify-between gap-2">
                          <span className="font-bold">{f.label}</span>
                          <span className="tnum text-sm font-bold text-muted">{f.id === 'oversized' ? '+' + money(PRICING.oversized) : 'Included'}</span>
                        </span>
                        <span className="mt-1 block text-sm text-muted">{f.desc}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className={card}>
                  <h3 className={h3}>Your measurements</h3>
                  <dl className="mt-3 grid grid-cols-2 gap-3 tnum">
                    <div className="rounded-none bg-panel p-4">
                      <dt className="text-sm text-muted">Garment chest</dt>
                      <dd className="font-display text-2xl font-extrabold">{chest} in</dd>
                    </div>
                    <div className="rounded-none bg-panel p-4">
                      <dt className="text-sm text-muted">Body length</dt>
                      <dd className="font-display text-2xl font-extrabold">{length} in</dd>
                    </div>
                  </dl>
                  <p className="mt-3 text-sm text-muted">[REPLACE WITH YOUR SUPPLIER'S SIZE CHART] Measured flat, doubled for chest.</p>
                </div>
              </div>
            )}
          </div>

          {/* PRICE */}
          <div className="border-t border-line bg-panel2 p-4 sm:p-6">
            <ul className="flex flex-col gap-1.5 text-sm tnum" aria-label="Price breakdown">
              {lines.map((l) => (
                <li key={l.label} className="flex items-baseline justify-between gap-4">
                  <span className="min-w-0 text-muted">{l.label}</span>
                  <span className="font-bold">{money(l.amt)}</span>
                </li>
              ))}
            </ul>
            <div className="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-3 border-t border-line pt-4">
              <div>
                <p className="text-sm text-muted">Total, size {size}, {ft.label.toLowerCase()}</p>
                <p className="font-display text-4xl font-extrabold tracking-tight tnum" aria-live="polite">{money(shownTotal)}</p>
              </div>
              <div className="flex flex-wrap gap-2">
                <button
                  type="button" onClick={reset}
                  className="min-h-[48px] rounded-none border-2 border-line px-5 text-sm font-bold transition duration-200 hover:border-accent"
                >Reset</button>
                <button
                  type="button"
                  onClick={addToCart}
                  className="caps min-h-[48px] rounded-none bg-fg px-7 text-sm font-bold text-bg transition-opacity duration-200 hover:opacity-90"
                >Add to cart</button>
              </div>
            </div>
            <p className="mt-3 text-sm text-muted">Made to order. [ADD YOUR DELIVERY TIMELINE AND GST NOTE]</p>
          </div>
        </section>
      </div>

      <div
        role="status" aria-live="polite"
        className={'pointer-events-none fixed left-1/2 z-50 w-[min(92vw,420px)] -translate-x-1/2 rounded-none bg-fg px-5 py-3 text-center text-sm font-bold text-bg transition duration-300 ' +
          (toast ? 'translate-y-0 opacity-100' : 'translate-y-3 opacity-0')}
        style={{ bottom: 'max(16px, env(safe-area-inset-bottom, 0px))' }}
      >{toast}</div>
    </div>
  );
}

// <storefront>
const BRAND = 'BLNK'; // working name: change it here and in the page <title>
const CART_KEY = 'hoodie-cart-v1';
const NAV_LINKS = [
  { id: 'customizer', label: 'Design' },
  { id: 'details', label: 'Details' },
  { id: 'how', label: 'How it works' }
];

function scrollToId(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

/* A small front-view hoodie used in the hero and in cart rows */
function HoodieArt({ colors, caption, font, capColor, label }) {
  const f = font || FONTS[0];
  const fs = caption ? Math.min(40, 140 / (Math.max(caption.length, 1) * f.cw)) : 0;
  return (
    <svg
      viewBox="0 20 400 390" role={label ? 'img' : undefined} aria-label={label || undefined}
      aria-hidden={label ? undefined : 'true'} className="block h-full w-full"
    >
      <path d={G.hoodFront} fill={colors.hood} {...SEAM} />
      <path d={G.sleeveL} fill={colors.sleeves} {...SEAM} />
      <path d={G.sleeveR} fill={colors.sleeves} {...SEAM} />
      <path d={G.cuffL} fill={colors.cuffs} {...SEAM} />
      <path d={G.cuffR} fill={colors.cuffs} {...SEAM} />
      <path d={G.bodyFront} fill={colors.body} {...SEAM} />
      <path d={G.hem} fill={colors.cuffs} {...SEAM} />
      <path d={G.pocket} fill="rgba(0,0,0,.10)" stroke="rgba(0,0,0,.3)" strokeWidth="1.5" strokeLinejoin="round" />
      <path d={G.lining} fill="rgba(0,0,0,.6)" />
      {caption && (
        <text x="200" y={250 + fs * 0.34} textAnchor="middle" fill={capColor} fontSize={fs} style={{ fontFamily: f.css }}>{caption}</text>
      )}
      <path d={G.stringL} stroke={colors.strings} strokeWidth="5" strokeLinecap="round" fill="none" />
      <path d={G.stringR} stroke={colors.strings} strokeWidth="5" strokeLinecap="round" fill="none" />
      <rect x="170" y="176" width="9" height="16" rx="3" fill={colors.strings} stroke="rgba(0,0,0,.3)" strokeWidth="1" />
      <rect x="221" y="172" width="9" height="16" rx="3" fill={colors.strings} stroke="rgba(0,0,0,.3)" strokeWidth="1" />
      <path d="M104 124 L130 132 L130 398 L104 398 Z" fill="rgba(0,0,0,.12)" />
      <path d="M296 124 L270 132 L270 398 L296 398 Z" fill="rgba(0,0,0,.12)" />
    </svg>
  );
}

function Nav({ count, onCart, cartBtnRef }) {
  const [menu, setMenu] = useState(false);
  const go = (id) => { setMenu(false); scrollToId(id); };
  return (
    <header className="sticky z-40 border-b border-line bg-bg" style={{ top: 'env(safe-area-inset-top, 0px)' }}>
      <div className="gutter mx-auto flex h-[60px] max-w-[1440px] items-center justify-between gap-4">
        <div className="flex items-center gap-2">
          <button
            type="button" aria-label={menu ? 'Close menu' : 'Open menu'} aria-expanded={menu}
            onClick={() => setMenu((m) => !m)}
            className="-ml-2 grid h-11 w-11 place-items-center transition-opacity duration-200 hover:opacity-70 md:hidden"
          >{menu ? <X size={22} aria-hidden="true" /> : <Menu size={22} aria-hidden="true" />}</button>
          <a href="#top" aria-label={BRAND + ' home'} className="text-2xl font-black tracking-tight" style={{ fontStretch: '125%' }}>{BRAND}</a>
        </div>
        <nav aria-label="Main" className="hidden items-center gap-8 md:flex">
          {NAV_LINKS.map((l) => (
            <button
              key={l.id} type="button" onClick={() => go(l.id)}
              className="caps py-2 text-xs font-bold text-muted transition-colors duration-200 hover:text-fg"
            >{l.label}</button>
          ))}
        </nav>
        <button
          ref={cartBtnRef} type="button" onClick={onCart}
          aria-label={count > 0 ? 'Open cart, ' + count + (count === 1 ? ' item' : ' items') : 'Open cart, empty'}
          className="relative -mr-2 grid h-11 w-11 place-items-center transition-opacity duration-200 hover:opacity-70"

      wasOpen.current = false;
      return undefined;
    }
    wasOpen.current = true;
    const t = setTimeout(() => { if (closeRef.current) closeRef.current.focus(); }, 60);
    const onKey = (e) => {
      if (e.key === 'Escape') { setOpen(false); return; }
      if (e.key !== 'Tab' || !drawerRef.current) return;
      const f = drawerRef.current.querySelectorAll('button:not([disabled]), a[href], input');
      if (!f.length) return;
      const first = f[0];
      const last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { clearTimeout(t); document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };

const SHIP = {

  express: { id: 'express', label: 'Express', price: 249, transit: [2, 3], note: 'Priority handling and faster courier.' }
};
const PRODUCTION_DAYS = 3;   // business days to print your hoodie [CONFIRM]
const TAX_RATE = 0.05;       // estimated GST [CONFIRM THE RATE WITH YOUR ACCOUNTANT]
const COD_FEE = 49;          // cash on delivery handling fee

const STATES = ['Andhra Pradesh', 'Arunachal Pradesh', 'Assam', 'Bihar', 'Chhattisgarh', 'Goa', 'Gujarat', 'Haryana', 'Himachal Pradesh', 'Jharkhand', 'Karnataka', 'Kerala', 'Madhya Pradesh', 'Maharashtra', 'Manipur', 'Meghalaya', 'Mizoram', 'Nagaland', 'Odisha', 'Punjab', 'Rajasthan', 'Sikkim', 'Tamil Nadu', 'Telangana', 'Tripura', 'Uttar Pradesh', 'Uttarakhand', 'West Bengal', 'Andaman and Nicobar Islands', 'Chandigarh', 'Dadra and Nagar Haveli and Daman and Diu', 'Delhi', 'Jammu and Kashmir', 'Ladakh', 'Lakshadweep', 'Puducherry'];

const digitsOnly = (s) => s.replace(/\D/g, '');

function detectBrand(d) {
  if (/^4/.test(d)) return 'visa';
  if (/^(5[1-5]|222[1-9]|22[3-9]\d|2[3-6]\d\d|27[01]\d|2720)/.test(d)) return 'mastercard';
  if (/^3[47]/.test(d)) return 'amex';
  if (/^(60|65|81|82|508)/.test(d)) return 'rupay';
  return null;
}
const BRAND_LABEL = { visa: 'VISA', mastercard: 'MASTERCARD', amex: 'AMEX', rupay: 'RUPAY' };

function formatCardNumber(raw) {
  const d = digitsOnly(raw);
  const brand = detectBrand(d);
  const x = d.slice(0, brand === 'amex' ? 15 : 16);
  const groups = brand === 'amex' ? [4, 6, 5] : [4, 4, 4, 4];
  const out = [];
  let i = 0;
  for (const g of groups) {
    if (i >= x.length) break;
    out.push(x.slice(i, i + g));
    i += g;
  }
  return out.join(' ');
}
function luhn(d) {
  let sum = 0;
  let alt = false;
  for (let i = d.length - 1; i >= 0; i--) {
    let n = Number(d[i]);
    if (alt) { n *= 2; if (n > 9) n -= 9; }
    sum += n;
    alt = !alt;
  }
  return d.length > 0 && sum % 10 === 0;
}
function formatExpiry(raw) {
  let d = digitsOnly(raw).slice(0, 4);
  if (d.length === 1 && Number(d) > 1) d = '0' + d;
  return d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d;
}
function expiryError(v) {
  const m = /^(\d{2})\/(\d{2})$/.exec(v);
  if (!m) return 'Enter the expiry as MM/YY.';
  const mm = Number(m[1]);
  const yy = Number(m[2]);
  if (mm < 1 || mm > 12) return 'The month must be 01 to 12.';
  const now = new Date();
  const cy = now.getFullYear() % 100;
  const cm = now.getMonth() + 1;
  if (yy < cy || (yy === cy && mm < cm)) return 'This card has expired.';
  return '';
}
function formatPhone(raw) {
  const d = digitsOnly(raw).slice(0, 10);
  return d.length > 5 ? d.slice(0, 5) + ' ' + d.slice(5) : d;
}

function validateAddress(a) {
  const e = {};
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(a.email.trim())) e.email = 'Enter a valid email address, like name@example.com.';
  if (!/^[6-9]\d{9}$/.test(digitsOnly(a.phone))) e.phone = 'Enter a 10-digit mobile number starting with 6, 7, 8 or 9.';
  if (a.name.trim().length < 2) e.name = 'Enter your full name.';
  if (a.line1.trim().length < 5) e.line1 = 'Enter your house number and street.';
  if (a.city.trim().length < 2) e.city = 'Enter your city or town.';
  if (!a.state) e.state = 'Choose your state.';
  if (!/^[1-9]\d{5}$/.test(a.pin.trim())) e.pin = 'Enter a 6-digit PIN code.';
  return e;
}
function validatePayment(pay, card, upi) {
  const e = {};
  if (pay === 'card') {
    const d = digitsOnly(card.number);
    const brand = detectBrand(d);
    const need = brand === 'amex' ? 15 : 16;
    if (d.length !== need || !luhn(d)) e.number = 'Check the card number. It should be ' + need + ' digits.';
    if (card.name.trim().length < 2) e.name = 'Enter the name printed on the card.';
    const ee = expiryError(card.exp);
    if (ee) e.exp = ee;
    const cl = brand === 'amex' ? 4 : 3;
    if (card.cvv.length !== cl) e.cvv = 'Enter the ' + cl + '-digit security code.';
  }
  if (pay === 'upi' && !/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(upi.trim())) e.upi = 'Enter a UPI ID like name@bank.';
  return e;
}

function addBizDays(d, n) {
  const x = new Date(d);
  let c = 0;
  while (c < n) {
    x.setDate(x.getDate() + 1);
    const w = x.getDay();
    if (w !== 0 && w !== 6) c++;
  }
  return x;
}
const fmtDay = (d) => d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
function estimate(method) {
  const now = new Date();
  const t = SHIP[method].transit;
  return fmtDay(addBizDays(now, PRODUCTION_DAYS + t[0])) + ' to ' + fmtDay(addBizDays(now, PRODUCTION_DAYS + t[1]));
}

    <section className="border border-line bg-panel">
      <h2>
        <button
          type="button" id={'acc-' + id} aria-expanded={open} aria-controls={'acc-panel-' + id}
          disabled={!enabled} onClick={onToggle}
          className="flex min-h-[72px] w-full items-center gap-4 px-5 py-4 text-left transition-colors duration-200 hover:bg-panel2 disabled:cursor-not-allowed disabled:hover:bg-panel"
        >
          <span className={'grid h-8 w-8 shrink-0 place-items-center text-sm font-black ' +
            (done ? 'bg-fg text-bg' : open ? 'border-2 border-fg' : 'border-2 border-line text-muted')}>
            {done ? <Check size={16} strokeWidth={3} aria-hidden="true" /> : n}
          </span>
          <span className="min-w-0 flex-1">
            <span className={'caps block text-sm font-black ' + (enabled ? '' : 'text-muted')}>{title}</span>
            {done && !open && summary && <span className="mt-1 block truncate text-sm text-muted">{summary}</span>}
          </span>
          {done && !open && <span className="caps text-xs font-bold underline underline-offset-4">Edit</span>}
          <ChevronDown size={20} aria-hidden="true" className={'shrink-0 transition-transform duration-200 ' + (open ? 'rotate-180' : '')} />
        </button>
      </h2>
      <div
        id={'acc-panel-' + id} role="region" aria-labelledby={'acc-' + id}
        className={'grid ' + (open ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]')}
        style={{ visibility: open ? 'visible' : 'hidden', transition: 'grid-template-rows .3s ease-out, visibility 0s linear ' + (open ? '0s' : '.3s') }}
      >
        <div className="min-h-0 overflow-hidden">
          <div className="border-t border-line px-5 py-6">{children}</div>
        </div>
      </div>
    </section>
  );
}

function CardPreview({ number, name, exp, cvv, brand, flipped }) {
  const tpl = brand === 'amex' ? '•••• •••••• •••••' : '•••• •••• •••• ••••';
  const d = digitsOnly(number);
  let di = 0;
  const shown = tpl.split('').map((ch) => (ch === '•' ? (d[di++] || '•') : ch)).join('');
  const face = { backfaceVisibility: 'hidden', WebkitBackfaceVisibility: 'hidden', background: '#14181F', color: '#F2F2EE', border: '1px solid rgba(255,255,255,.14)' };
  return (
    <div className="mx-auto mb-6 w-full max-w-[340px]" style={{ perspective: '900px' }} aria-hidden="true">
      <div className="relative aspect-[1.586]" style={{ transformStyle: 'preserve-3d', transition: 'transform .6s cubic-bezier(.2,.8,.2,1)', transform: flipped ? 'rotateY(180deg)' : 'none' }}>
        <div className="absolute inset-0 flex flex-col justify-between p-5" style={face}>
          <div className="flex items-start justify-between">
            <svg width="44" height="32" viewBox="0 0 44 32"><rect x="1" y="1" width="42" height="30" rx="5" fill="#E8A93A" /><path d="M1 11h42M1 21h42M15 1v30M29 1v30" stroke="rgba(0,0,0,.35)" strokeWidth="1.2" fill="none" /></svg>
            <span className="text-xs font-black tracking-[0.18em] opacity-90">{brand ? BRAND_LABEL[brand] : 'CARD'}</span>
          </div>
          <p className="tnum text-[clamp(1.05rem,4.4vw,1.35rem)] font-bold tracking-[0.12em]">{shown}</p>
          <div className="flex items-end justify-between gap-3 text-[11px]">
            <div className="min-w-0"><p className="opacity-60">CARDHOLDER</p><p className="truncate text-sm font-bold uppercase tracking-wide">{name.trim() || 'Your name'}</p></div>
            <div><p className="opacity-60">EXPIRES</p><p className="tnum text-sm font-bold">{exp || 'MM/YY'}</p></div>
          </div>
        </div>
        <div className="absolute inset-0 overflow-hidden" style={{ ...face, transform: 'rotateY(180deg)' }}>
          <div className="mt-6 h-10 bg-black" />
          <div className="mx-5 mt-5 flex items-center justify-end gap-3 bg-white px-3 py-2 text-black">
            <span className="text-[10px] font-bold opacity-60">CVV</span>
            <span className="tnum min-w-[34px] text-right text-sm font-black tracking-widest">{cvv ? cvv.replace(/./g, '•') : '•••'}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function SuccessModal({ order, onDone }) {
  const btn = useRef(null);
  useEffect(() => {
    const t = setTimeout(() => { if (btn.current) btn.current.focus(); }, 80);
    const onKey = (e) => {
      if (e.key === 'Escape') onDone();
      if (e.key === 'Tab') { e.preventDefault(); if (btn.current) btn.current.focus(); }
    };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { clearTimeout(t); document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, []);
  const bits = [
    { dx: '-120px', rot: '240deg', c: '#E8A93A', l: '12%' }, { dx: '-70px', rot: '-180deg', c: 'var(--fg)', l: '24%' },
    { dx: '-20px', rot: '300deg', c: '#E8A93A', l: '36%' }, { dx: '30px', rot: '-260deg', c: 'var(--muted)', l: '48%' },
    { dx: '80px', rot: '200deg', c: '#E8A93A', l: '60%' }, { dx: '120px', rot: '-300deg', c: 'var(--fg)', l: '72%' },
    { dx: '150px', rot: '260deg', c: '#E8A93A', l: '84%' }, { dx: '-150px', rot: '-220deg', c: 'var(--muted)', l: '6%' }
  ];
  return (
    <div className="fixed inset-0 z-[60] grid place-items-center overflow-y-auto p-4" style={{ paddingTop: 'max(16px, env(safe-area-inset-top, 0px))', paddingBottom: 'max(16px, env(safe-area-inset-bottom, 0px))' }}>
      <div className="fixed inset-0 bg-black/60" aria-hidden="true" />
      <div role="dialog" aria-modal="true" aria-labelledby="done-title" className="modal-in relative w-full max-w-[460px] overflow-hidden bg-panel p-8 text-center shadow-2xl sm:p-10">
        <div className="pointer-events-none absolute inset-x-0 top-0 h-40" aria-hidden="true">
          {bits.map((b, i) => (
            <span key={i} className="confetti-piece absolute top-10 block h-2.5 w-2.5" style={{ left: b.l, background: b.c, '--dx': b.dx, '--rot': b.rot, animationDelay: i * 60 + 'ms' }} />
          ))}
        </div>
        <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true" className="mx-auto">
          <circle cx="42" cy="42" r="38" fill="none" strokeWidth="4" className="draw" style={{ stroke: 'var(--fg)', '--len': 240 }} />
          <path d="M26 43 L38 55 L59 31" fill="none" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" className="draw" style={{ stroke: 'var(--accent)', '--len': 60, animationDelay: '.45s' }} />
        </svg>
        <h2 id="done-title" className="mt-5 text-4xl font-black uppercase leading-none" style={{ fontStretch: '75%' }}>Order placed</h2>
        <p className="mt-3 text-muted">Thanks, {order.firstName}. Your hoodie goes to print next.</p>
        <div className="mt-6 border border-line bg-bg p-4 text-left">
          <p className="caps text-[11px] font-bold text-muted">Order number</p>
          <p className="tnum mt-1 text-2xl font-black tracking-wide">{order.number}</p>
          <dl className="mt-4 grid gap-2 text-sm">
            <div className="flex justify-between gap-4"><dt className="text-muted">Items</dt><dd className="tnum font-bold">{order.items}</dd></div>
            <div className="flex justify-between gap-4"><dt className="text-muted">Arrives</dt><dd className="text-right font-bold">{order.arrives}</dd></div>
            <div className="flex justify-between gap-4"><dt className="text-muted">Payment</dt><dd className="min-w-0 break-words text-right font-bold">{order.payLabel}</dd></div>
            <div className="flex justify-between gap-4 border-t border-line pt-2"><dt className="font-bold">Total</dt><dd className="tnum text-lg font-black">{money(order.total)}</dd></div>
          </dl>
        </div>
        <p className="mt-4 text-sm text-muted">This is a demo order. No payment was taken and nothing will be printed.</p>
        <button
          ref={btn} type="button" onClick={onDone}
          className="caps mt-6 flex min-h-[54px] w-full items-center justify-center gap-3 bg-fg px-6 text-sm font-bold text-bg transition-opacity duration-200 hover:opacity-90"
        >Continue shopping <ArrowRight size={18} aria-hidden="true" /></button>
      </div>
    </div>
  );
}

function SummaryItem({ it }) {
  const fabric = FABRICS.find((f) => f.id === it.fabric) || FABRICS[0];
  const fit = FITS.find((f) => f.id === it.fit) || FITS[0];
  const font = it.text ? (FONTS.find((f) => f.id === it.text.font) || FONTS[0]) : null;
  const rows = ['Size ' + it.size + ', ' + fit.label.toLowerCase() + ' fit', fabric.name + ', ' + fabric.gsm + ' GSM'];
  if (it.text) rows.push('Text “' + it.text.value + '”, ' + font.name + ', ' + it.text.side);
  if (it.graphic) rows.push('Graphic: ' + it.graphic.name + ', ' + it.graphic.side);
  return (
    <li className="flex gap-4 border-b border-line py-4 first:pt-0">
      <div className="relative h-20 w-20 shrink-0 bg-stage p-1.5">
        <HoodieArt colors={it.colors} caption={it.text && it.text.side === 'front' ? it.text.value : ''} font={font} capColor={it.text ? it.text.color : '#fff'} />
        <span className="tnum absolute -right-2 -top-2 grid h-6 min-w-[24px] place-items-center bg-fg px-1 text-xs font-black text-bg">{it.qty}</span>
      </div>
      <div className="min-w-0 flex-1">
        <div className="flex items-start justify-between gap-3">
          <p className="font-bold">Custom hoodie</p>
          <p className="tnum shrink-0 font-bold">{money(it.unit * it.qty)}</p>
        </div>
        <ul className="mt-1 text-sm text-muted">{rows.map((r) => <li key={r} className="break-words">{r}</li>)}</ul>
        <div className="mt-2 flex items-center gap-1" aria-label="Colours used">
          {['body', 'sleeves', 'hood', 'strings', 'cuffs'].map((p) => (
            <span key={p} title={p + ': ' + colourName(it.colors[p])} className="h-3 w-3 rounded-full border border-line" style={{ background: it.colors[p] }} />
          ))}
        </div>
      </div>
    </li>
  );
}

function Checkout({ cart, onBack, onComplete }) {
  const [open, setOpen] = useState('shipping');
  const [done, setDone] = useState({ shipping: false, method: false, payment: false });
  const [addr, setAddr] = useState({ email: '', phone: '', name: '', line1: '', line2: '', city: '', state: '', pin: '' });
  const [aErr, setAErr] = useState({});
  const [method, setMethod] = useState('standard');
  const [pay, setPay] = useState('card');
  const [card, setCard] = useState({ number: '', name: '', exp: '', cvv: '' });
  const [upi, setUpi] = useState('');
  const [pErr, setPErr] = useState({});
  const [flip, setFlip] = useState(false);
  const [msg, setMsg] = useState('');
  const [order, setOrder] = useState(null);

  const subtotal = cart.reduce((s, x) => s + x.unit * x.qty, 0);
  const count = cart.reduce((s, x) => s + x.qty, 0);
  const sm = SHIP[method];
  const shipFree = method === 'standard' && sm.freeOver && subtotal >= sm.freeOver;
  const shipPrice = shipFree ? 0 : sm.price;
  const codFee = pay === 'cod' ? COD_FEE : 0;
  const tax = Math.round(subtotal * TAX_RATE);
  const total = subtotal + shipPrice + codFee + tax;
  const toFree = method === 'standard' && sm.freeOver && subtotal < sm.freeOver ? sm.freeOver - subtotal : 0;

  const focusSoon = (id) => setTimeout(() => { const el = document.getElementById(id); if (el) el.focus(); }, 340);
  const firstBad = (errs, order, prefix) => {
    const k = order.find((x) => errs[x]);
    if (k) { const el = document.getElementById(prefix + k); if (el) el.focus(); }
  };

  const updAddr = (k, v) => { setAddr((a) => ({ ...a, [k]: v })); setDone((d) => ({ ...d, shipping: false })); setMsg(''); };
  const inp = (k, extra) => ({
    id: 'f-' + k, value: addr[k], onChange: (e) => updAddr(k, e.target.value),
    'aria-invalid': !!aErr[k], 'aria-describedby': aErr[k] ? 'f-' + k + '-err' : undefined,
    className: inputCls(aErr[k]), ...extra
  });
  const updCard = (k, v) => { setCard((c) => ({ ...c, [k]: v })); setDone((d) => ({ ...d, payment: false })); setMsg(''); };
  const pinp = (k, value, onChange, extra) => ({
    id: 'p-' + k, value: value, onChange: onChange,
    'aria-invalid': !!pErr[k], 'aria-describedby': pErr[k] ? 'p-' + k + '-err' : undefined,
    className: inputCls(pErr[k]), ...extra
  });

  const saveShipping = () => {
    const errs = validateAddress(addr);
    setAErr(errs);
    if (Object.keys(errs).length) { firstBad(errs, ['email', 'phone', 'name', 'line1', 'city', 'state', 'pin'], 'f-'); return; }
    setDone((d) => ({ ...d, shipping: true }));
    setOpen('method');
    focusSoon('m-' + method);
  };
  const saveMethod = () => {
    setDone((d) => ({ ...d, method: true }));
    setOpen('payment');
    focusSoon('pay-' + pay);
  };
  const savePayment = () => {
    const errs = validatePayment(pay, card, upi);
    setPErr(errs);
    if (Object.keys(errs).length) { firstBad(errs, ['number', 'name', 'exp', 'cvv', 'upi'], 'p-'); return; }
    setDone((d) => ({ ...d, payment: true }));
    setOpen(null);
  };

  const fillSample = () => {
    setAddr({ email: 'name@example.com', phone: '98765 43210', name: 'Sample Customer', line1: '12 Sample Street, Andheri West', line2: '', city: 'Mumbai', state: 'Maharashtra', pin: '400053' });
    setAErr({}); setDone((d) => ({ ...d, shipping: false }));
  };
  const fillCard = () => {
    setCard({ number: '4242 4242 4242 4242', name: 'Sample Customer', exp: '12/34', cvv: '123' });
    setPErr({}); setDone((d) => ({ ...d, payment: false }));
  };

  const toggle = (id, enabled) => () => { if (enabled) setOpen((o) => (o === id ? null : id)); };

  const placeOrder = () => {
    if (!cart.length) return;
    const next = !done.shipping ? 'shipping' : !done.method ? 'method' : !done.payment ? 'payment' : null;
    if (next) {
      setOpen(next);
      setMsg(next === 'shipping' ? 'Add your shipping address to place the order.' : next === 'method' ? 'Confirm a shipping method to continue.' : 'Add your payment details to place the order.');
      const el = document.getElementById('acc-' + next);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    const last4 = digitsOnly(card.number).slice(-4);
    setOrder({
      number: 'BLNK-' + String(Math.floor(100000 + Math.random() * 900000)),
      firstName: addr.name.trim().split(' ')[0],
      items: count + (count === 1 ? ' hoodie' : ' hoodies'),
      arrives: estimate(method),
      payLabel: pay === 'card' ? (detectBrand(digitsOnly(card.number)) ? BRAND_LABEL[detectBrand(digitsOnly(card.number))] + ' ending ' : 'Card ending ') + last4 : pay === 'upi' ? 'UPI, ' + upi.trim() : 'Cash on delivery',
      total: total
    });
  };

  const brand = detectBrand(digitsOnly(card.number));
  const payTabs = [
    { id: 'card', label: 'Card', icon: CreditCard },
    { id: 'upi', label: 'UPI', icon: Smartphone },
    { id: 'cod', label: 'Cash on delivery', icon: Banknote }
  ];

  return (
    <div className="font-body">
      <header className="border-b border-line bg-bg">
        <div className="gutter mx-auto flex h-[60px] max-w-[1200px] items-center justify-between">
          <button type="button" onClick={() => onBack(false)} aria-label={BRAND + ' home'} className="text-2xl font-black tracking-tight" style={{ fontStretch: '125%' }}>{BRAND}</button>
          <p className="caps flex items-center gap-2 text-xs font-bold text-muted"><Lock size={14} aria-hidden="true" /> Checkout</p>
        </div>
      </header>

      <main className="gutter mx-auto max-w-[1200px] py-8 lg:py-12">
        <button type="button" onClick={() => onBack(true)} className="caps -ml-1 mb-4 inline-flex min-h-[44px] items-center gap-1 text-xs font-bold text-muted transition-colors duration-200 hover:text-fg">
          <ChevronLeft size={16} aria-hidden="true" /> Back to your cart
        </button>
        <h1 className="mb-8 font-black uppercase leading-[0.9] tracking-tight" style={{ fontSize: 'clamp(2.4rem, 6vw, 4.5rem)', fontStretch: '75%' }}>Checkout</h1>

        {cart.length === 0 ? (
          <div className="border border-line bg-panel p-8">
            <p className="text-2xl font-black uppercase" style={{ fontStretch: '75%' }}>Your cart is empty</p>
            <p className="mt-2 text-muted">Design a hoodie first, then come back to check out.</p>
            <button type="button" onClick={() => onBack(false)} className="caps mt-5 min-h-[48px] bg-fg px-6 text-xs font-bold text-bg">Start designing</button>
          </div>
        ) : (
          <div className="grid items-start gap-8 lg:grid-cols-[minmax(0,1.25fr)_minmax(0,0.85fr)] lg:gap-12">

            {/* LEFT: accordion */}
            <div className="flex min-w-0 flex-col gap-3">

              <Section
                id="shipping" n="1" title="Shipping address" open={open === 'shipping'} done={done.shipping} enabled
                summary={addr.name + ', ' + addr.line1 + ', ' + addr.city + ' ' + addr.pin}
                onToggle={toggle('shipping', true)}
              >
                <div className="mb-4 flex flex-wrap items-center justify-between gap-2">
                  <p className="text-sm text-muted">We use this to deliver your order and send updates.</p>
                  <button type="button" onClick={fillSample} className="min-h-[44px] text-sm font-bold underline underline-offset-4 hover:opacity-70">Fill sample details</button>
                </div>
                <div className="grid gap-4 sm:grid-cols-2">
                  <div className="sm:col-span-2">
                    <Field id="f-email" label="Email" error={aErr.email}>
                      <input {...inp('email', { type: 'email', autoComplete: 'email', inputMode: 'email', placeholder: 'name@example.com' })} />
                    </Field>
                  </div>
                  <Field id="f-name" label="Full name" error={aErr.name}>
                    <input {...inp('name', { type: 'text', autoComplete: 'name' })} />
                  </Field>
                  <Field id="f-phone" label="Mobile number" error={aErr.phone}>
                    <div className="flex">
                      <span className="grid h-12 place-items-center border-2 border-r-0 border-line bg-panel2 px-3 text-sm font-bold">+91</span>
                      <input {...inp('phone', { type: 'tel', autoComplete: 'tel-national', inputMode: 'numeric', placeholder: '98765 43210', onChange: (e) => updAddr('phone', formatPhone(e.target.value)) })} />
                    </div>
                  </Field>
                  <div className="sm:col-span-2">
                    <Field id="f-line1" label="Address" error={aErr.line1}>
                      <input {...inp('line1', { type: 'text', autoComplete: 'address-line1', placeholder: 'House number, street' })} />
                    </Field>
                  </div>
                  <div className="sm:col-span-2">
                    <Field id="f-line2" label="Apartment, landmark (optional)">
                      <input {...inp('line2', { type: 'text', autoComplete: 'address-line2' })} />
                    </Field>
                  </div>
                  <Field id="f-city" label="City" error={aErr.city}>
                    <input {...inp('city', { type: 'text', autoComplete: 'address-level2' })} />
                  </Field>
                  <Field id="f-pin" label="PIN code" error={aErr.pin}>
                    <input {...inp('pin', { type: 'text', autoComplete: 'postal-code', inputMode: 'numeric', maxLength: 6, placeholder: '400001', onChange: (e) => updAddr('pin', digitsOnly(e.target.value).slice(0, 6)) })} />
                  </Field>
                  <Field id="f-state" label="State" error={aErr.state}>
                    <select {...inp('state', { autoComplete: 'address-level1' })}>
                      <option value="">Choose a state</option>
                      {STATES.map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </Field>
                  <Field id="f-country" label="Country">
                    <input id="f-country" type="text" value="India" readOnly className="h-12 w-full border-2 border-line bg-panel2 px-4 text-base text-muted" />
                  </Field>
                </div>
                <button type="button" onClick={saveShipping} className="caps mt-6 flex min-h-[52px] w-full items-center justify-center gap-3 bg-fg px-8 text-sm font-bold text-bg transition-opacity duration-200 hover:opacity-90 sm:w-auto">
                  Continue to shipping method <ArrowRight size={18} aria-hidden="true" />
                </button>
              </Section>

              <Section
                id="method" n="2" title="Shipping method" open={open === 'method'} done={done.method} enabled={done.shipping}
                summary={sm.label + ', arrives ' + estimate(method)}
                onToggle={toggle('method', done.shipping)}
              >
                <div role="radiogroup" aria-label="Shipping method" className="grid gap-3">
                  {Object.values(SHIP).map((s) => {
                    const free = s.id === 'standard' && s.freeOver && subtotal >= s.freeOver;
                    const on = method === s.id;
                    return (
                      <label key={s.id} className={'flex cursor-pointer items-start gap-4 border-2 p-4 transition-colors duration-200 focus-within:ring-2 focus-within:ring-[color:var(--focus)] ' + (on ? 'border-fg bg-bg' : 'border-line hover:border-muted')}>
                        <input
                          id={'m-' + s.id} type="radio" name="ship-method" className="sr-only" checked={on}
                          onChange={() => { setMethod(s.id); setDone((d) => ({ ...d, method: false })); }}
                        />
                        <span aria-hidden="true" className={'mt-1 grid h-5 w-5 shrink-0 place-items-center rounded-full border-2 ' + (on ? 'border-fg' : 'border-line')}>
                          {on && <span className="h-2.5 w-2.5 rounded-full bg-fg" />}
                        </span>
                        <span className="min-w-0 flex-1">
                          <span className="flex items-baseline justify-between gap-3">
                            <span className="font-bold">{s.label}</span>
                            <span className="tnum font-bold">{free ? 'Free' : money(s.price)}</span>
                          </span>
                          <span className="mt-0.5 block text-sm text-muted">{s.note}</span>
                          <span className="mt-1 block text-sm font-bold">Arrives {estimate(s.id)}</span>
                        </span>
                      </label>
                    );
                  })}
                </div>
                <p className="mt-3 text-sm text-muted">Dates include {PRODUCTION_DAYS} working days to print your hoodie. [CONFIRM YOUR PRODUCTION TIME]</p>
                <button type="button" onClick={saveMethod} className="caps mt-6 flex min-h-[52px] w-full items-center justify-center gap-3 bg-fg px-8 text-sm font-bold text-bg transition-opacity duration-200 hover:opacity-90 sm:w-auto">
                  Continue to payment <ArrowRight size={18} aria-hidden="true" />
                </button>
              </Section>

              <Section
                id="payment" n="3" title="Payment details" open={open === 'payment'} done={done.payment} enabled={done.method}
                summary={pay === 'card' ? (brand ? BRAND_LABEL[brand] + ' ' : 'Card ') + 'ending ' + digitsOnly(card.number).slice(-4) : pay === 'upi' ? 'UPI, ' + upi : 'Cash on delivery'}
                onToggle={toggle('payment', done.method)}
              >
                <div className="mb-5 flex gap-3 border border-line bg-bg p-4 text-sm">
                  <Lock size={18} aria-hidden="true" className="mt-0.5 shrink-0" />
                  <p><span className="font-bold">Demo checkout.</span> No payment is taken and nothing is stored. Please don't enter a real card number.</p>
                </div>

                <div role="radiogroup" aria-label="Payment method" className="grid gap-2 sm:grid-cols-3">
                  {payTabs.map((t) => {
                    const Icon = t.icon;
                    const on = pay === t.id;
                    return (
                      <label key={t.id} className={'flex min-h-[56px] cursor-pointer items-center gap-3 border-2 px-4 text-sm font-bold transition-colors duration-200 focus-within:ring-2 focus-within:ring-[color:var(--focus)] ' + (on ? 'border-fg bg-bg' : 'border-line text-muted hover:border-muted hover:text-fg')}>
                        <input id={'pay-' + t.id} type="radio" name="pay-method" className="sr-only" checked={on} onChange={() => { setPay(t.id); setPErr({}); setDone((d) => ({ ...d, payment: false })); }} />
                        <Icon size={20} aria-hidden="true" /> {t.label}
                      </label>
                    );
                  })}
                </div>

                <div className="mt-6">
                  {pay === 'card' && (
                    <div className="rise">
                      <CardPreview number={card.number} name={card.name} exp={card.exp} cvv={card.cvv} brand={brand} flipped={flip} />
                      <div className="grid gap-4 sm:grid-cols-2">
                        <div className="sm:col-span-2">
                          <Field id="p-number" label="Card number" error={pErr.number} right={brand ? <span className="text-xs font-black tracking-[0.14em] text-muted">{BRAND_LABEL[brand]}</span> : null}>
                            <input {...pinp('number', card.number, (e) => updCard('number', formatCardNumber(e.target.value)), { type: 'text', inputMode: 'numeric', autoComplete: 'cc-number', placeholder: '1234 5678 9012 3456' })} />
                          </Field>
                        </div>
                        <div className="sm:col-span-2">
                          <Field id="p-name" label="Name on card" error={pErr.name}>
                            <input {...pinp('name', card.name, (e) => updCard('name', e.target.value.replace(/[^a-zA-Z .'-]/g, '').slice(0, 26)), { type: 'text', autoComplete: 'cc-name' })} />
                          </Field>
                        </div>
                        <Field id="p-exp" label="Expiry" error={pErr.exp}>
                          <input {...pinp('exp', card.exp, (e) => updCard('exp', formatExpiry(e.target.value)), { type: 'text', inputMode: 'numeric', autoComplete: 'cc-exp', placeholder: 'MM/YY', maxLength: 5 })} />
                        </Field>
                        <Field id="p-cvv" label={brand === 'amex' ? 'Security code (4 digits)' : 'CVV'} error={pErr.cvv}>
                          <input {...pinp('cvv', card.cvv, (e) => updCard('cvv', digitsOnly(e.target.value).slice(0, brand === 'amex' ? 4 : 3)), { type: 'password', inputMode: 'numeric', autoComplete: 'cc-csc', placeholder: brand === 'amex' ? '1234' : '123', onFocus: () => setFlip(true), onBlur: () => setFlip(false) })} />
                        </Field>
                      </div>
                      <button type="button" onClick={fillCard} className="mt-3 min-h-[44px] text-sm font-bold underline underline-offset-4 hover:opacity-70">Fill a test card</button>
                    </div>
                  )}
                  {pay === 'upi' && (
                    <div className="rise">
                      <Field id="p-upi" label="UPI ID" error={pErr.upi} hint="You would approve the payment in your UPI app.">
                        <input {...pinp('upi', upi, (e) => { setUpi(e.target.value); setDone((d) => ({ ...d, payment: false })); }, { type: 'text', autoComplete: 'off', placeholder: 'name@bank' })} />
                      </Field>
                    </div>
                  )}
                  {pay === 'cod' && (
                    <div className="rise border border-line bg-bg p-4 text-sm">
                      <p className="font-bold">Pay when it arrives</p>
                      <p className="mt-1 text-muted">Pay by cash or UPI to the delivery partner. A {money(COD_FEE)} handling fee is added to your total. [CONFIRM YOUR COD POLICY]</p>
                    </div>
                  )}
                </div>

                <button type="button" onClick={savePayment} className="caps mt-6 flex min-h-[52px] w-full items-center justify-center gap-3 bg-fg px-8 text-sm font-bold text-bg transition-opacity duration-200 hover:opacity-90 sm:w-auto">
                  Save payment details <Check size={18} aria-hidden="true" />
                </button>
              </Section>
            </div>

            {/* RIGHT: summary */}
            <aside aria-label="Order summary" className="min-w-0 border border-line bg-panel p-5 sm:p-6 lg:sticky lg:top-6">
              <div className="mb-5 flex items-baseline justify-between gap-3">
                <h2 className="caps text-sm font-black">Order summary <span className="tnum text-muted">({count})</span></h2>
                <button type="button" onClick={() => onBack(true)} className="min-h-[44px] text-sm font-bold underline underline-offset-4 hover:opacity-70">Edit cart</button>
              </div>
              <ul>{cart.map((it) => <SummaryItem key={it.id} it={it} />)}</ul>

              <dl className="tnum mt-5 grid gap-2.5 text-sm">
                <div className="flex justify-between gap-4"><dt className="text-muted">Subtotal</dt><dd className="font-bold">{money(subtotal)}</dd></div>
                <div className="flex justify-between gap-4"><dt className="text-muted">Shipping, {sm.label.toLowerCase()}</dt><dd className="font-bold">{shipFree ? 'Free' : money(shipPrice)}</dd></div>
                {codFee > 0 && <div className="flex justify-between gap-4"><dt className="text-muted">Cash on delivery fee</dt><dd className="font-bold">{money(codFee)}</dd></div>}
                <div className="flex justify-between gap-4"><dt className="text-muted">Estimated GST ({Math.round(TAX_RATE * 100)}%)</dt><dd className="font-bold">{money(tax)}</dd></div>
              </dl>
              {toFree > 0 && <p className="mt-3 bg-bg p-3 text-sm">Add {money(toFree)} more to get free standard shipping.</p>}

              <div className="mt-5 flex items-baseline justify-between gap-4 border-t border-line pt-5">
                <span className="caps text-xs font-bold text-muted">Total</span>
                <span className="tnum text-3xl font-black">{money(total)}</span>
              </div>

              <button
                type="button" onClick={placeOrder}
                className="caps group mt-5 flex min-h-[58px] w-full items-center justify-between bg-fg px-6 text-sm font-bold text-bg transition-opacity duration-200 hover:opacity-90"
              >
                <span>Place order</span>
                <ArrowRight size={20} aria-hidden="true" className="transition-transform duration-200 group-hover:translate-x-1" />
              </button>
              {msg && <p role="alert" className="rise mt-3 text-sm font-bold text-danger">{msg}</p>}
              <p className="mt-3 text-xs text-muted">By placing your order you agree to the [ADD YOUR TERMS AND PRIVACY LINKS]. GST rate is an estimate. [CONFIRM]</p>
            </aside>
          </div>
        )}
      </main>

      {order && <SuccessModal order={order} onDone={onComplete} />}
    </div>
  );
}
// </checkout>

/* ================= APP: shop and checkout in one page ================= */
function loadCart() {
  try {
    const raw = window.localStorage.getItem(CART_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed.filter((x) => x && x.id && x.colors && x.qty > 0) : [];
  } catch (e) { return []; }
}

function App() {
  const [cart, setCart] = useState(loadCart);
  const [view, setView] = useState('shop');
  const [reopen, setReopen] = useState(false);

  useEffect(() => {
    try { window.localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) { /* storage unavailable */ }
  }, [cart]);
  useEffect(() => { window.scrollTo(0, 0); }, [view]);

  const goShop = (openCart) => { setReopen(!!openCart); setView('shop'); };

  if (view === 'checkout') {
    return <Checkout cart={cart} onBack={goShop} onComplete={() => { setCart([]); goShop(false); }} />;
  }
  return <Shop cart={cart} setCart={setCart} startOpen={reopen} onCheckout={() => setView('checkout')} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
